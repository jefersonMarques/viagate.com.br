<svg
  xmlns="http://www.w3.org/2000/svg"
  width="709"
  height="760"
  viewBox="0 0 709 760"
>
  <title>Biometric facial scan silhouette</title>
  <desc>Silhueta biométrica com moldura sem margem, linhas internas e scanner animado.</desc>

  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scanGlow" x="-30%" y="-500%" width="160%" height="1100%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scanBeamGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21ff9c" stop-opacity="0"/>
      <stop offset="42%" stop-color="#21ff9c" stop-opacity="0.06"/>
      <stop offset="78%" stop-color="#21ff9c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#21ff9c" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="scannerClip">
      <rect x="0" y="0" width="709" height="760"/>
    </clipPath>

    <clipPath id="bustClip">
      <path
        d="
          M316 182
          L290 203
          L257 238
          L256 266
          L255 300
          L243 310
          L249 362
          L265 372
          L269 376
          L276 400
          L286 408
          L286 458
          L268 469
          L238 482
          L227 486
          L187 506
          L164 514
          L148 520
          L127 529
          L88 569
          L83 627
          L83 659
          L626 659
          L626 627
          L623 569
          L584 529
          L567 522
          L552 517
          L539 512
          L526 507
          L488 490
          L468 480
          L445 468
          L427 459
          L427 407
          L437 398
          L444 374
          L460 363
          L464 358
          L468 310
          L456 300
          L457 282
          L456 281
          L454 238
          L421 204
          L393 182
          Z
        "
      />
    </clipPath>

    <pattern
      id="bustLinePattern"
      width="14"
      height="14"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(-45)"
    >
      <line
        x1="0"
        y1="2"
        x2="14"
        y2="2"
        stroke="#21ff9c"
        stroke-width="1.2"
        opacity="0.72"
      />
    </pattern>

    <style><![CDATA[
      .frame-layer {
        animation: framePulse 2.8s ease-in-out infinite;
      }

      .silhouette-primary {
        animation: silhouettePulse 2.4s ease-in-out infinite;
      }

      .silhouette-highlight {
        animation: highlightPulse 2.4s ease-in-out infinite;
      }

      .bust-lines {
        animation: linesPulse 2.1s ease-in-out infinite;
      }

      .scan-beam {
        animation: scanMove 3.4s cubic-bezier(0.42, 0, 0.58, 1) infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .scan-line {
        animation: scanLinePulse 0.8s ease-in-out infinite alternate;
      }

      @keyframes framePulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.82; }
      }

      @keyframes silhouettePulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 0.62; }
      }

      @keyframes highlightPulse {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }

      @keyframes linesPulse {
        0%, 100% { opacity: 0.58; }
        50% { opacity: 0.92; }
      }

      @keyframes scanMove {
        0% {
          transform: translateY(-220px);
          opacity: 0;
        }

        8% {
          opacity: 1;
        }

        90% {
          opacity: 1;
        }

        100% {
          transform: translateY(560px);
          opacity: 0;
        }
      }

      @keyframes scanLinePulse {
        from { opacity: 0.72; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .frame-layer,
        .silhouette-primary,
        .silhouette-highlight,
        .bust-lines,
        .scan-beam,
        .scan-line {
          animation: none !important;
        }
      }
    ]]></style>
  </defs>

  <g
    class="frame-layer"
    fill="none"
    stroke="#21ff9c"
    stroke-linecap="square"
  >
    <rect
      x="0.5"
      y="0.5"
      width="708"
      height="759"
      stroke-width="1"
      opacity="0.18"
    />

    <path
      d="
        M0 44 V0 H44
        M665 0 H709 V44
        M0 716 V760 H44
        M665 760 H709 V716
      "
      stroke-width="4"
      opacity="0.92"
      filter="url(#softGlow)"
    />
  </g>

  <g
    fill="none"
    stroke-linecap="square"
    stroke-linejoin="miter"
  >
    <path
      class="silhouette-primary"
      d="
        M316 182
        L290 203
        L257 238
        L256 266
        L255 300
        L243 310
        L249 362
        L265 372
        L269 376
        L276 400
        L286 408
        L286 458
        L268 469
        L238 482
        L227 486
        L187 506
        L164 514
        L148 520
        L127 529
        L88 569
        L83 627
        M393 182
        L421 204
        L454 238
        L456 281
        L457 282
        L456 300
        L468 310
        L464 358
        L460 363
        L444 374
        L437 398
        L427 407
        L427 459
        L445 468
        L468 480
        L488 490
        L526 507
        L539 512
        L552 517
        L567 522
        L584 529
        L623 569
        L626 627
        M316 182
        C337 180 372 180 393 182
      "
      stroke="#0b5d3d"
      stroke-width="9"
      opacity="0.42"
      filter="url(#softGlow)"
    />

    <path
      class="silhouette-highlight"
      d="
        M316 182
        L290 203
        L257 238
        L256 266
        L255 300
        L243 310
        L249 362
        L265 372
        L269 376
        L276 400
        L286 408
        L286 458
        L268 469
        L238 482
        L227 486
        L187 506
        L164 514
        L148 520
        L127 529
        L88 569
        L83 627
        M393 182
        L421 204
        L454 238
        L456 281
        L457 282
        L456 300
        L468 310
        L464 358
        L460 363
        L444 374
        L437 398
        L427 407
        L427 459
        L445 468
        L468 480
        L488 490
        L526 507
        L539 512
        L552 517
        L567 522
        L584 529
        L623 569
        L626 627
        M316 182
        C337 180 372 180 393 182
      "
      stroke="#21ff9c"
      stroke-width="2.2"
      opacity="0.94"
      filter="url(#softGlow)"
    />
  </g>

  <g
    class="bust-lines"
    clip-path="url(#bustClip)"
    pointer-events="none"
  >
    <rect
      x="70"
      y="170"
      width="570"
      height="500"
      fill="url(#bustLinePattern)"
    />
  </g>

  <g clip-path="url(#scannerClip)" pointer-events="none">
    <g class="scan-beam">
      <rect
        x="0"
        y="160"
        width="709"
        height="92"
        fill="url(#scanBeamGradient)"
      />

      <line
        class="scan-line"
        x1="16"
        y1="250"
        x2="693"
        y2="250"
        stroke="#39ffad"
        stroke-width="2"
        filter="url(#scanGlow)"
      />

      <line
        x1="16"
        y1="253"
        x2="693"
        y2="253"
        stroke="#39ffad"
        stroke-width="0.8"
        opacity="0.45"
      />
    </g>
  </g>
</svg>
